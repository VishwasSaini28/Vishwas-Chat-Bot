<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>✨ Vishwas Bot</title>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #fdf6f0, #fcefee); /* pastel gradient */
    margin: 0;
    color: #333; /* softer text */
  }
  .chat-container {
    width: 70%;
    margin: 40px auto;
    background: #ffffffcc; /* semi-transparent pastel white */
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  }
  .messages {
    height: 450px;
    overflow-y: auto;
    padding: 15px;
    border-radius: 10px;
    background: #fafafa; /* light pastel background */
    margin-bottom: 15px;
  }
  .message {
    display: flex;
    margin: 12px 0;
    animation: fadeIn 0.4s ease-in;
  }
  .bubble {
    padding: 12px 16px;
    border-radius: 18px;
    max-width: 70%;
    line-height: 1.4;
    color: #333;
  }
  .user .bubble {
    background: #ffe5ec; /* pastel pink */
    margin-left: auto;
    border-bottom-right-radius: 4px;
  }
  .bot .bubble {
    background: #d8f3dc; /* pastel green */
    margin-right: auto;
    border-bottom-left-radius: 4px;
  }
  .input-area {
    display: flex;
    gap: 10px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    outline: none;
    font-size: 15px;
    background: #fffafc; /* soft pastel input */
  }
  button {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background: #a3c4f3; /* pastel blue */
    color: #333;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }
  button:hover {
    background: #90dbf4; /* lighter pastel blue */
  }
  #micBtn {
    background: #f7a9a8; /* pastel coral */
    color: #fff;
  }
  #micBtn.listening {
    background: #f28482; /* darker pastel coral when recording */
  }
  .option-btn {
    margin: 5px;
    padding: 8px 12px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    background: #a3c4f3; /* pastel blue */
    color: #333;
  }
  .url-btn {
    background: #f7a9a8; /* pastel pink for links */
    color: #fff;
  }
  @keyframes fadeIn {
    from {opacity: 0; transform: translateY(10px);}
    to {opacity: 1; transform: translateY(0);}
  }
</style>

</head>
<body>
  <div class="chat-container">
    <h2>🤖 Vishwas Bot</h2>
    <div class="messages" id="messages">
      <div class="message bot"><div class="bubble bot">Say HI, HELLO, or HEY to begin!</div></div>
    </div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Type your question...">
      <button onclick="sendMessage()">Send</button>
      <button id="micBtn">🎤</button>
    </div>
  </div>
  <script>
    const input = document.getElementById("userInput");
    const messageBox = document.getElementById("messages");
    const micBtn = document.getElementById("micBtn");
    let recognition;

    input.addEventListener("keypress", function(event) {
      if (event.key === "Enter") sendMessage();
    });

    async function sendMessage(optionText = null) {
      const userText = optionText || input.value.trim();
      if (!userText) return;

      addMessage(userText, "user");
      input.value = "";

      const typingMsg = addMessage("Bot is typing...", "bot");

      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: userText })
      });
      const data = await response.json();
      typingMsg.querySelector(".bubble").textContent = data.reply;

      // 🔧 Remove old buttons before showing new ones
      const oldButtons = document.querySelectorAll(".option-btn");
      oldButtons.forEach(btn => btn.remove());

      // Show new buttons
      if (data.options && data.options.length > 0) {
        const optionsDiv = document.createElement("div");
        optionsDiv.style.marginTop = "10px";

        data.options.forEach(opt => {
          const btn = document.createElement("button");
          btn.textContent = opt;
          btn.className = "option-btn";
          btn.onclick = () => sendMessage(opt.toLowerCase());
          optionsDiv.appendChild(btn);
        });

        messageBox.appendChild(optionsDiv);
      }

      // Handle direct link buttons
      if (data.link) {
        const linkBtn = document.createElement("button");
        linkBtn.textContent = "Open " + data.reply.replace("Opening ", "");
        linkBtn.className = "option-btn url-btn";
        linkBtn.onclick = () => window.open(data.link, "_blank");
        messageBox.appendChild(linkBtn);
      }

      messageBox.scrollTop = messageBox.scrollHeight;
    }

    function addMessage(text, sender) {
      const msg = document.createElement("div");
      msg.className = "message " + sender;

      const bubble = document.createElement("div");
      bubble.className = "bubble " + sender;
      bubble.textContent = text;

      msg.appendChild(bubble);
      messageBox.appendChild(msg);
      messageBox.scrollTop = messageBox.scrollHeight;
      return msg;
    }

    // 🎤 Speech Recognition
    if ("webkitSpeechRecognition" in window) {
      recognition = new webkitSpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = "en-US";

      recognition.onstart = () => micBtn.classList.add("listening");
      recognition.onend = () => micBtn.classList.remove("listening");
      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        input.value = transcript;
        sendMessage();
      };
      recognition.onerror = (event) => {
        console.error("Speech recognition error:", event.error);
        micBtn.classList.remove("listening");
      };
    }

    micBtn.addEventListener("click", () => {
      if (recognition) {
        recognition.start();
      } else {
        alert("Speech recognition not supported in this browser.");
      }
    });
  </script>
</body>
</html>
